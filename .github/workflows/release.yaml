name: release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
permissions:
  id-token: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
      - run: vpx -y @arianrhodsandlot/release-kit release-notes --version ${{ github.ref_name }}
      - run: vp pm version from-git -- --no-git-tag-version
      - run: vp pm publish --access=public
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ./release-notes.md
